# G2: deploys to the non-production Environment "qa" (story 12529). GitHub creates the deployment and its
# statuses from this run, so their log_url / target_url point at /actions/runs/<this run id>.
name: Deploy QA
run-name: ${{ inputs.label || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      label:
        description: Name of this run (the sandbox passes the run key, for example I2-COV); empty leaves the default
        required: false
        default: ""
permissions:
  contents: read
  deployments: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: qa
    steps:
      - run: echo "deploying ${GITHUB_SHA} to qa"
