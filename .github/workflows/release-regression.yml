# G3: the release regression run - uploads an artifact named exactly ReleaseRegression; 2 of its 20 tests fail (story 12529).
name: Release Regression
run-name: ${{ inputs.label || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      label:
        description: Name of this run (the sandbox passes the run key, for example I2-COV); empty leaves the default
        required: false
        default: ""
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ReleaseRegression
          path: fixtures/junit-release-regression.xml
